    background-size: cover;
    background-position: center;
    background-attachment: scroll;
    background-color: var(--walnut-dark);
    color:var(--cream);
    font-family:'Karla',sans-serif;
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
  }
  .app{width:100%; max-width:460px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--maple);
    opacity:.85;
  }
  button{
    font-family:'Karla',sans-serif;
    font-weight:600;
    cursor:pointer;
    border:none;
    border-radius:10px;
  }
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn{
    background:linear-gradient(180deg, var(--maple), #a97b45);
    color:var(--walnut-dark);
    padding:12px 18px;
    font-size:15px;
    box-shadow:0 3px 0 #6e4a2e, 0 6px 14px rgba(0,0,0,.35);
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #6e4a2e;}
  .btn.ghost{
    background:transparent;
    color:var(--cream);
    border:1.5px solid var(--line);
    box-shadow:none;
  }
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn.full{width:100%;}

<script>
const RANK_LABEL = {1:'A',11:'J',12:'Q',13:'K'};
const SUITS = { S:'♠', H:'♥', D:'♦', C:'♣' };
const RED_SUITS = new Set(['H','D']);
const COLORS = [
  {name:'Rose',   hex:'#B5495B', glow:'#e18497'},
  {name:'Gold',   hex:'#C9932E', glow:'#e9c67e'},
  {name:'Teal',   hex:'#3F8E7C', glow:'#7ec7b5'},
  {name:'Violet', hex:'#7C5CB0', glow:'#b79bdc'}
];
// Stylized (non-likeness) seated characters — simple flat illustration, not a portrait.
const AVATARS = [
  { id:'skye', label:'Skye', skin:'#e8b48c', hair:'#5b3d2b', outfit:'#B5495B', style:'shoulder' },
  { id:'mum',  label:'Mum',  skin:'#e8b48c', hair:'#d9bd6a', outfit:'#4a6fa5', style:'shoulder-sunnies' },
  { id:'dad',  label:'Dad',  skin:'#dba573', hair:null,      outfit:'#3a3f44', style:'bald-glasses' },
  { id:'harvey', label:'Harvey', skin:'#e6b088', hair:'#8a6a45', outfit:'#c17a4f', style:'messy-stubble' },
  { id:'dog', label:'Koda', skin:null, hair:null, outfit:'#6b9bc3', style:'husky' }
];
function avatarById(id){ return AVATARS.find(a=>a.id===id) || null; }

// Builds the inner SVG markup for one seated character (no outer <svg> tag).
function avatarFigureMarkup(av){
  const { skin, hair, outfit, style } = av;
  if (style==='husky'){
    return `
      <rect x="17" y="10" width="46" height="50" rx="9" fill="#C79A63" opacity="0.9"/>
      <rect x="19" y="52" width="42" height="34" rx="15" fill="#f2f1ee"/>
      <ellipse cx="15" cy="66" rx="7" ry="6" fill="#f2f1ee"/>
      <ellipse cx="65" cy="66" rx="7" ry="6" fill="#f2f1ee"/>
      <path d="M20 22 L28 4 L34 20 Z" fill="#5b5b5f"/>
      <path d="M60 22 L52 4 L46 20 Z" fill="#5b5b5f"/>
      <path d="M22.5 19 L28 9 L31.5 18.5 Z" fill="#e8e8ea"/>
      <path d="M57.5 19 L52 9 L48.5 18.5 Z" fill="#e8e8ea"/>
      <circle cx="40" cy="33" r="17" fill="#8a8a8f"/>
      <path d="M26 34 Q40 30 54 34 Q54 48 40 50 Q26 48 26 34 Z" fill="#fbfbfa"/>
      <path d="M30 20 Q40 14 50 20 Q46 26 40 26 Q34 26 30 20 Z" fill="#5b5b5f" opacity="0.85"/>
      <ellipse cx="33" cy="32" rx="3.4" ry="4" fill="#7ec8e3"/>
      <ellipse cx="47" cy="32" rx="3.4" ry="4" fill="#7ec8e3"/>
      <circle cx="33" cy="32" r="1.3" fill="#1c1c1c"/>
      <circle cx="47" cy="32" r="1.3" fill="#1c1c1c"/>
      <ellipse cx="40" cy="42" rx="3" ry="2.2" fill="#20201f"/>
      <path d="M33 46 Q40 50 47 46" stroke="#20201f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    `;
  }
  const hasHair = style==='shoulder' || style==='shoulder-sunnies';
  const hairBehind = hasHair
    ? `<path d="M21 30 Q22 12 40 11 Q58 12 59 30 L59 46 Q52 40 52 30 Q52 20 40 19 Q28 20 28 30 Q28 40 21 46 Z" fill="${hair}"/>`
    : '';
  const messyHair = style==='messy-stubble'
    ? `<path d="M23 26 Q22 16 27 12 L29 20 L33 8 L37 18 L40 6 L43 18 L47 8 L51 20 L53 12 Q58 16 57 26 Q50 18 40 18 Q30 18 23 26 Z" fill="${hair}"/>`
    : '';
  const stubble = style==='messy-stubble'
    ? `<path d="M29 39 Q40 47 51 39 L50 44 Q40 50 30 44 Z" fill="${hair}" opacity="0.4"/>`
    : '';
  const sunnies = style==='shoulder-sunnies'
    ? `<rect x="30" y="9" width="20" height="5" rx="2.5" fill="#2b2f33" opacity="0.85"/>
       <circle cx="34" cy="11.5" r="4" fill="#2b2f33" opacity="0.85"/><circle cx="46" cy="11.5" r="4" fill="#2b2f33" opacity="0.85"/>`
    : '';
  const glasses = style==='bald-glasses'
    ? `<circle cx="34" cy="31" r="5.5" fill="none" stroke="#2b2f33" stroke-width="2"/>
       <circle cx="46" cy="31" r="5.5" fill="none" stroke="#2b2f33" stroke-width="2"/>
       <line x1="39.5" y1="31" x2="40.5" y2="31" stroke="#2b2f33" stroke-width="2"/>`
    : '';
  const eyeR = style==='bald-glasses' ? 1.5 : 1.8;

  return `
    <rect x="17" y="10" width="46" height="50" rx="9" fill="#C79A63" opacity="0.9"/>
    <rect x="19" y="52" width="42" height="34" rx="15" fill="${outfit}"/>
    <ellipse cx="15" cy="66" rx="7" ry="6" fill="${outfit}"/>
    <ellipse cx="65" cy="66" rx="7" ry="6" fill="${outfit}"/>
    ${hairBehind}${messyHair}
    <circle cx="40" cy="32" r="16" fill="${skin}"/>
    ${sunnies}
    <circle cx="34" cy="30" r="${eyeR}" fill="#2b2f33"/><circle cx="46" cy="30" r="${eyeR}" fill="#2b2f33"/>
    <path d="M34 37 Q40 41 46 37" stroke="#2b2f33" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    ${stubble}
    ${glasses}
  `;
}

// A plain colour-dot figure for anyone not using a Skye/Mum/Dad look.
function plainFigureMarkup(hex, initial){
  return `
    <rect x="17" y="10" width="46" height="50" rx="9" fill="#C79A63" opacity="0.9"/>
    <rect x="19" y="52" width="42" height="34" rx="15" fill="${hex}"/>
    <circle cx="40" cy="32" r="16" fill="${hex}"/>
    <text x="40" y="38" text-anchor="middle" font-family="Fraunces, serif" font-size="18" fill="rgba(255,255,255,.9)">${initial}</text>
  `;
}

function seatFigureSvg(p, size){
  const av = avatarById(p.avatar);
  const inner = av ? avatarFigureMarkup(av) : plainFigureMarkup(p.color, (p.name||'?').charAt(0).toUpperCase());
  return `<svg viewBox="0 0 80 100" width="${size}" height="${size*1.25}">${inner}</svg>`;
}

const DEAL_COUNTS = {2:6, 3:5, 4:5};
const DISCARD_COUNTS = {2:2, 3:1, 4:1};

function rankLabel(r){ return RANK_LABEL[r] || String(r); }
function cardValue(c){ return Math.min(c.r, 10); }

function buildDeck(){
  const deck = [];
  for (const s of ['S','H','D','C']) for (let r=1;r<=13;r++) deck.push({r, s});
  return deck;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ---------- Scoring ----------
function combinations(arr, k, start=0, cur=[], out=[]){
  if (cur.length===k){ out.push(cur.slice()); return out; }
  for (let i=start;i<arr.length;i++){
    cur.push(arr[i]); combinations(arr,k,i+1,cur,out); cur.pop();
  }
  return out;
}
function scoreHand(cards, starter, isCrib){
  const all = [...cards, starter];
  let total = 0; const details = [];
  for (let k=2;k<=5;k++){
    for (const combo of combinations(all,k)){
      const sum = combo.reduce((s,c)=>s+cardValue(c),0);
      if (sum===15){ total+=2; details.push('Fifteen for 2'); }
    }
  }
  const rankGroups = {};
  for (const c of all) (rankGroups[c.r] = rankGroups[c.r]||[]).push(c);
  for (const r in rankGroups){
    const n = rankGroups[r].length;
    if (n>=2){
      const pts = n*(n-1); total += pts;
      const label = n===2?'Pair for 2':n===3?'Pair royal for 6':'Double pair royal for 12';
      details.push(label);
    }
  }
  const distinctRanks = Object.keys(rankGroups).map(Number).sort((a,b)=>a-b);
  let i=0;
  while (i<distinctRanks.length){
    let j=i;
    while (j+1<distinctRanks.length && distinctRanks[j+1]===distinctRanks[j]+1) j++;
    const runLen = j-i+1;
    if (runLen>=3){
      let mult = 1;
      for (let k=i;k<=j;k++) mult *= rankGroups[distinctRanks[k]].length;
      total += runLen*mult;
      details.push(`Run of ${runLen} for ${runLen*mult}`);
    }
    i = j+1;
  }
  const handSuits = new Set(cards.map(c=>c.s));
  if (!isCrib){
    if (handSuits.size===1){
      const bonusStarter = starter.s === cards[0].s;
      total += bonusStarter ? 5 : 4;
      details.push(bonusStarter ? 'Flush for 5' : 'Flush for 4');
    }
  } else {
    const allSuits = new Set(all.map(c=>c.s));
    if (allSuits.size===1){ total += 5; details.push('Flush for 5'); }
  }
  if (cards.some(c=>c.r===11 && c.s===starter.s)){ total += 1; details.push('Nobs for 1'); }
  return { total, details };
}
function peggingScore(pile, count){
  let pts = 0; const details = [];
  if (count===15){ pts+=2; details.push('Fifteen for 2'); }
  if (count===31){ pts+=2; details.push('Thirty-one for 2'); }
  const n = pile.length;
  let run=1;
  for (let i=n-2;i>=0 && pile[i].r===pile[n-1].r;i--) run++;
  if (run===2){ pts+=2; details.push('Pair for 2'); }
  else if (run===3){ pts+=6; details.push('Pair royal for 6'); }
  else if (run===4){ pts+=12; details.push('Double pair royal for 12'); }
  for (let k=Math.min(n,7); k>=3; k--){
    const slice = pile.slice(n-k);
    const ranks = slice.map(c=>c.r).sort((a,b)=>a-b);
    if (new Set(ranks).size!==ranks.length) continue;
    let consec=true;
    for (let x=1;x<ranks.length;x++) if (ranks[x]!==ranks[x-1]+1){ consec=false; break; }
    if (consec){ pts+=k; details.push(`Run of ${k} for ${k}`); break; }
  }
  return { pts, details };
}

// Play-by-link locks each page-load to whichever single player was "active" when it
// loaded — once the turn moves to someone else, this device can't act for them; that
// forces an actual link hand-off instead of quietly playing everyone's turns yourself.
let sessionActorLock = null;

function isSharedDevice(){ return state.settings.solo && !state.settings.playByLink; }
function canAct(requiredId){
  if (state.settings.playByLink){
    if (sessionActorLock===null) sessionActorLock = requiredId;
    return sessionActorLock === requiredId;
  }
  return state.settings.solo || myId===requiredId;
}
let actionBusy = false; // guards against double-taps firing an action twice before re-render

function getPlayer(id){ return state.players.find(p=>p.id===id); }
function seatOrderIds(){ return state.players.slice().sort((a,b)=>a.seat-b.seat).map(p=>p.id); }
function nextPlayerId(fromId){
  const ids = seatOrderIds();
  const idx = ids.indexOf(fromId);
  return ids[(idx+1)%ids.length];
}
function canPlay(pid, count){ return state.pegging.available[pid].some(c=>count+cardValue(c)<=31); }
function findNextPlayable(fromId, count){
  const ids = seatOrderIds();
  const startIdx = ids.indexOf(fromId);
  for (let k=1;k<=ids.length;k++){
    const pid = ids[(startIdx+k)%ids.length];
    if (state.pegging.available[pid].length>0 && canPlay(pid, count)) return pid;
  }
  return null;
}
function findNextWithCards(fromId){
  const ids = seatOrderIds();
  const startIdx = ids.indexOf(fromId);
  for (let k=1;k<=ids.length;k++){
    const pid = ids[(startIdx+k)%ids.length];
    if (state.pegging.available[pid].length>0) return pid;
  }
  return null;
}
function effectiveScore(pid){
  if (!state.settings.teams) return state.scores[pid];
  const team = getPlayer(pid).team;
  return state.players.filter(p=>p.team===team).reduce((s,p)=>s+state.scores[p.id],0);
}
function teamTotal(team){
  return state.players.filter(p=>p.team===team).reduce((s,p)=>s+state.scores[p.id],0);
}
// In solo mode, this device acts on behalf of whichever player's turn it currently is.
// In play-by-link mode, it's locked to a single player per page-load (see canAct above).
function actingId(){
  if (state.settings.playByLink){
    if (sessionActorLock===null) sessionActorLock = naturalActorId();
    return sessionActorLock;
  }
  if (!state.settings.solo) return myId;
  if (state.status==='discard'){
    const p = state.players.find(p=>!state.submittedDiscard[p.id]);
    return p ? p.id : myId;
  }
  if (state.status==='pegging') return state.pegging.turn;
  if (state.status==='counting'){
    const step = currentCountingStep();
    return step ? step.owner : myId;
  }
  return myId;
}

function encodeStateForLink(){

    if (!match) return null;
    const json = decodeURIComponent(escape(atob(decodeURIComponent(match[1]))));
    return JSON.parse(json);
  }catch(e){ return null; }
}
function updateLinkHash(){

// What the game state itself says should happen right now — independent of
// whether this page-load is actually locked to that player yet.
function naturalActorId(){
  if (state.status==='discard'){
    const p = state.players.find(p=>!state.submittedDiscard[p.id]);
    return p ? p.id : (state.players[0] ? state.players[0].id : myId);
  }
  if (state.status==='pegging') return state.pegging.turn;
  if (state.status==='counting'){
    const step = currentCountingStep();
    return step ? step.owner : (state.players[0] ? state.players[0].id : myId);
  }

function addScore(pid, pts, label){

function dealHandInto(baseState, dealerId){
  const N = baseState.players.length;
  const deck = shuffle(buildDeck());
  const hands = {};
  for (const p of baseState.players) hands[p.id] = deck.splice(0, DEAL_COUNTS[N]);
  const submittedDiscard = {};
  for (const p of baseState.players) submittedDiscard[p.id] = false;
  return {
    ...baseState,
    status:'discard', dealer:dealerId,
    hands, origHands:{}, crib:[], submittedDiscard,
    starter:null,
    pegging:{available:{}, pile:[], count:0, turn:null, lastPlayer:null, log:[]},
    counting:{order:[], index:0, revealed:[]},
    _deck: deck
  };
}

// A hand starts with an interactive shuffle instead of dealing straight away —
// the actual deck shuffle + deal happens in performShuffle() once someone taps.
function beginShuffle(baseState, dealerId){
  return {
    ...baseState,
    status:'shuffling', dealer:dealerId,
    hands:{}, origHands:{}, crib:[], submittedDiscard:{},
    starter:null,
    pegging:{available:{}, pile:[], count:0, turn:null, lastPlayer:null, log:[]},
    counting:{order:[], index:0, revealed:[]}
  };
}

async function performShuffle(){
  if (actionBusy) return;
  if (state.status!=='shuffling' || !canAct(state.dealer)) return;
  actionBusy = true;
  try{
    shuffleAnimating = true;
    render();
    await new Promise(r=>setTimeout(r, 1100));
    state = dealHandInto(state, state.dealer);
    shuffleAnimating = false;
    await saveState();
  } finally { actionBusy = false; }
}

// The player to the dealer's right (the same person who leads the pegging)
// cuts the deck once it's shuffled — that reveals and seats the starter card.
async function performCut(){
  if (actionBusy) return;
  const cutterId = nextPlayerId(state.dealer);
  if (state.status!=='cutting' || !canAct(cutterId)) return;
  actionBusy = true;
  try{
    cutAnimating = true;
    render();
    await new Promise(r=>setTimeout(r, 900));
    const deck = state._deck && state._deck.length ? state._deck : shuffle(buildDeck());
    const starter = deck.pop();
    state.starter = starter;
    if (starter.r===11){ addScore(state.dealer, 2, 'His heels'); }
    const available = {};
    for (const p of state.players) available[p.id] = state.hands[p.id].slice();
    state.pegging.available = available;
    state.pegging.turn = nextPlayerId(state.dealer);
    state.pegging.lastPlayer = null;
    cutAnimating = false;
    if (state.status!=='gameover') state.status = 'pegging';
    await saveState();
  } finally { actionBusy = false; }
}

// ---------- Discard ----------
function toggleDiscard(idx){
  if (state.submittedDiscard[actingId()]) return;
  const need = DISCARD_COUNTS[state.players.length];
  const pos = selectedDiscards.indexOf(idx);
  if (pos>=0) selectedDiscards.splice(pos,1);
  else if (selectedDiscards.length<need) selectedDiscards.push(idx);
  render();
}

async function confirmDiscard(){
  if (actionBusy) return;
  const who = actingId();
  const need = DISCARD_COUNTS[state.players.length];
  if (selectedDiscards.length!==need) return;
  actionBusy = true;
  try{
    const ok = performDiscard(who, selectedDiscards);
    selectedDiscards = [];
    if (ok) await saveState();
  } finally { actionBusy = false; }
}

// Core discard logic, reusable for a human player or the computer opponent.
function performDiscard(pid, idxs){
  const need = DISCARD_COUNTS[state.players.length];
  if (idxs.length!==need) return false;
  if (state.submittedDiscard[pid]) return false;
  const hand = state.hands[pid];
  const chosen = idxs.map(i=>hand[i]);
  if (chosen.some(c=>!c)) return false; // stale indices, bail safely

  state.hands[pid] = hand.filter((_,i)=>!idxs.includes(i));
  state.crib.push(...chosen);
  state.submittedDiscard[pid] = true;

  const allIn = state.players.every(p=>state.submittedDiscard[p.id]);
  if (allIn){
    const N = state.players.length;
    if (N===3 && state._deck && state._deck.length){ state.crib.push(state._deck.pop()); }
    const origHands = {};
    for (const p of state.players) origHands[p.id] = state.hands[p.id].slice();
    state.origHands = origHands;
    // Don't draw the starter automatically — wait for the interactive cut.
    if (state.status !== 'gameover') state.status = 'cutting';
  }
  return true;
}

// ---------- Pegging ----------
async function playCard(cardIdx){
  if (actionBusy) return;
  const p = actingId();
  actionBusy = true;
  try{
    const ok = performPlay(p, cardIdx);
    if (ok) await saveState();
  } finally { actionBusy = false; }
}

// Core play-a-card logic, reusable for a human player or the computer opponent.
function performPlay(pid, cardIdx){
  if (state.status!=='pegging' || state.pegging.turn!==pid) return false;
  const card = state.pegging.available[pid][cardIdx];
  if (!card) return false; // stale index from a double-tap or a race with a re-render
  if (state.pegging.count + cardValue(card) > 31) return false;

  state.pegging.available[pid].splice(cardIdx,1);
  state.pegging.pile.push({...card, owner:pid});
  state.pegging.count += cardValue(card);
  state.pegging.lastPlayer = pid;

  const {pts, details} = peggingScore(state.pegging.pile, state.pegging.count);
  if (pts>0) addScore(pid, pts, details.join(', '));

  if (state.status!=='gameover') afterPlay(pid);
  return true;
}

function afterPlay(playerId){
  const st = state.pegging;
  const allEmpty = state.players.every(p=>st.available[p.id].length===0);
  if (allEmpty){
    if (st.count!==31){ addScore(playerId, 1, 'Last card for 1'); }
    st.pile = []; st.count = 0;
    if (state.status!=='gameover') startCounting();
    return;
  }
  const next = findNextPlayable(playerId, st.count);
  if (next){ st.turn = next; }
  else {
    if (st.count!==31){ addScore(st.lastPlayer, 1, 'Go for 1'); }
    st.pile = []; st.count = 0;
    if (state.status!=='gameover'){
      const lead = findNextWithCards(playerId);
      if (lead) st.turn = lead; else startCounting();
    }
  }
}

async function sayGo(){

  actionBusy = true;

// Core "Go" logic, reusable for a human player or the computer opponent.
function performGo(pid){
  const st = state.pegging;
  if (state.status!=='pegging' || st.turn!==pid || canPlay(pid, st.count)) return false;
  const next = findNextPlayable(pid, st.count);
  if (next){ st.turn = next; }
  else {
    const last = st.lastPlayer;
    if (last && st.count!==31){ addScore(last, 1, 'Go for 1'); }
    st.pile = []; st.count = 0;
    const allEmpty = state.players.every(pl=>st.available[pl.id].length===0);
    if (allEmpty){ if (state.status!=='gameover') startCounting(); }
    else {
      const lead = findNextWithCards(pid);
      if (lead) st.turn = lead;
    }
  }
  return true;
}

// ---------- Computer opponent ----------
async function botMaybeAct(){
  if (!state || !state.settings || !state.settings.vsComputer) return;
  if (state.status==='gameover') return;
  if (actionBusy) return;

  if (state.status==='shuffling' && state.dealer==='bot'){
    actionBusy = true;
    try{
      state = dealHandInto(state, state.dealer);
      await saveState();
    } finally { actionBusy = false; }
  } else if (state.status==='cutting' && nextPlayerId(state.dealer)==='bot'){
    actionBusy = true;
    try{
      const deck = state._deck && state._deck.length ? state._deck : shuffle(buildDeck());
      const starter = deck.pop();
      state.starter = starter;
      if (starter.r===11){ addScore(state.dealer, 2, 'His heels'); }
      const available = {};
      for (const p of state.players) available[p.id] = state.hands[p.id].slice();
      state.pegging.available = available;
      state.pegging.turn = nextPlayerId(state.dealer);
      state.pegging.lastPlayer = null;
      if (state.status!=='gameover') state.status = 'pegging';
      await saveState();
    } finally { actionBusy = false; }
  } else if (state.status==='discard' && !state.submittedDiscard['bot']){
    actionBusy = true;
    try{
      const need = DISCARD_COUNTS[state.players.length];
      const hand = state.hands['bot'];
      const idxs = shuffle([...Array(hand.length).keys()]).slice(0, need);
      const ok = performDiscard('bot', idxs);
      if (ok) await saveState();
    } finally { actionBusy = false; }
  } else if (state.status==='pegging' && state.pegging.turn==='bot'){
    actionBusy = true;
    try{
      const avail = state.pegging.available['bot'];
      const count = state.pegging.count;
      const playableIdxs = avail
        .map((c,i)=>({c,i}))
        .filter(o=>count+cardValue(o.c)<=31)
        .map(o=>o.i);
      let ok;
      if (playableIdxs.length){
        const idx = playableIdxs[Math.floor(Math.random()*playableIdxs.length)];
        ok = performPlay('bot', idx);
      } else {
        ok = performGo('bot');
      }
      if (ok) await saveState();
    } finally { actionBusy = false; }
  } else if (state.status==='counting'){
    if (state.muggins && state.muggins.from!=='bot'){
      // The computer is a sharp opponent — it always catches missed points.
      actionBusy = true;
      try{
        addScore('bot', state.muggins.amount, `Claimed ${getPlayer(state.muggins.from).name}'s missed points`);
        state.muggins = null;
        if (state.status!=='gameover' && state.counting.index>=state.counting.order.length){
          state = beginShuffle(state, nextPlayerId(state.dealer));
        }
        await saveState();
      } finally { actionBusy = false; }
    } else {
      const step = currentCountingStep();
      if (step && step.owner==='bot'){
        actionBusy = true;
        try{
          const ok = performCount('bot', null); // null = let the computer count itself correctly
          if (ok) await saveState();
        } finally { actionBusy = false; }
      }
    }
  }
}

// ---------- Counting ----------
function startCounting(){
  const ids = seatOrderIds();
  const dIdx = ids.indexOf(state.dealer);
  const order = [];
  for (let k=1;k<ids.length;k++) order.push({type:'hand', owner: ids[(dIdx+k)%ids.length]});
  order.push({type:'hand', owner: state.dealer});
  order.push({type:'crib', owner: state.dealer});
  state.counting = {order, index:0, revealed:[]};
  state.status = 'counting';
}
function currentCountingStep(){
  const c = state.counting;
  return c.index < c.order.length ? c.order[c.index] : null;
}

// Core counting-confirm logic. Pass an explicit `pts` for a human's self-reported
// count, or null to have the computer score itself correctly (used only for the bot).
function performCount(pid, pts){
  const step = currentCountingStep();
  if (!step || step.owner!==pid) return false;
  const cards = step.type==='crib' ? state.crib : state.origHands[step.owner];
  const correct = scoreHand(cards, state.starter, step.type==='crib').total;

  let finalPts, label, missed = 0;
  if (pts===null){
    // The computer always counts itself correctly.
    finalPts = correct;
    label = `${step.type==='crib'?'Crib':'Hand'} — counted correctly`;
  } else {
    if (isNaN(pts) || pts<0 || pts>29) return false;
    // Overshoot: you just get your true score, no bonus for the inflated guess.
    // Undershoot: you get what you claimed, and the rest is up for grabs (muggins).
    finalPts = Math.min(pts, correct);
    missed = Math.max(0, correct - pts);
    label = `${step.type==='crib'?'Crib':'Hand'} — counted ${pts}`;
  }

  state.counting.revealed.push({...step, cards, score: finalPts});
  addScore(step.owner, finalPts, label);
  state.counting.index++;

  if (missed>0 && state.status!=='gameover'){
    state.muggins = { amount: missed, from: step.owner, type: step.type };
  } else if (state.status!=='gameover' && state.counting.index>=state.counting.order.length){
    state = beginShuffle(state, nextPlayerId(state.dealer));
  }
  return true;
}

async function claimMuggins(pid){
  if (actionBusy) return;
  if (!state.muggins || pid===state.muggins.from || !canAct(pid)) return;
  actionBusy = true;
  try{
    addScore(pid, state.muggins.amount, `Claimed ${getPlayer(state.muggins.from).name}'s missed points`);
    state.muggins = null;
    if (state.status!=='gameover' && state.counting.index>=state.counting.order.length){
      state = beginShuffle(state, nextPlayerId(state.dealer));
    }
    await saveState();
  } finally { actionBusy = false; }
}

async function skipMuggins(){
  if (actionBusy) return;
  if (!state.muggins) return;
  actionBusy = true;
  try{
    state.muggins = null;
    if (state.status!=='gameover' && state.counting.index>=state.counting.order.length){
      state = beginShuffle(state, nextPlayerId(state.dealer));
    }
    await saveState();
  } finally { actionBusy = false; }
}

async function confirmCount(rawValue){
  if (actionBusy) return;
  const step = currentCountingStep();
  if (!step) return;
  const who = actingId();
  if (step.owner!==who) return;
  const pts = parseInt(rawValue,10);
  actionBusy = true;
  try{
    const ok = performCount(step.owner, pts);
    if (ok){
      countInputValue = '';
      peekCorrect = false;
      await saveState();
    }
  } finally { actionBusy = false; }
}

async function playAgain(){
  const scores = {}; for (const p of state.players) scores[p.id]=0;
  state = beginShuffle({...state, scores, winner:null}, state.players[Math.floor(Math.random()*state.players.length)].id);
  await saveState();
}

function renderBoard(){
  const teams = state.settings.teams;
  const players = state.players.slice().sort((a,b)=>a.seat-b.seat);

  // A nested 3-lane "up, U-turn, back down" track — like a real travel cribbage board.
  const cx = 150, topY = 132, bottomY = 350;
  const halfWidths = [40, 74, 108]; // innermost -> outermost lane
  const laneAccent = ['#3a6ea5', '#3f8e52', '#B5495B']; // subtle background channel tint only

  function pointOnLane(li, score){
    const hw = halfWidths[li];
    const leftX = cx-hw, rightX = cx+hw;
    const t = Math.max(0, Math.min(score,121)) / 121;
    if (t<=0.47){
      const yy = bottomY - (t/0.47)*(bottomY-topY);
      return { x:leftX, y:yy };
    } else if (t<0.53){
      const angle = 180 - ((t-0.47)/0.06)*180;
      const rad = angle*Math.PI/180;
      return { x: cx+hw*Math.cos(rad), y: topY-hw*Math.sin(rad) };
    } else {
      const yy = topY + ((t-0.53)/0.47)*(bottomY-topY);
      return { x:rightX, y:yy };
    }
  }
  function lanePathD(li){
    const hw = halfWidths[li];
    return `M ${cx-hw} ${bottomY} L ${cx-hw} ${topY} A ${hw} ${hw} 0 0 1 ${cx+hw} ${topY} L ${cx+hw} ${bottomY}`;
  }

  const laneCount = Math.min(3, Math.max(1, players.length===0?1:Math.min(3,players.length)));
  // Always show all 3 lanes for the authentic look, regardless of player count.
  let channelsSvg = '';
  for (let li=0; li<3; li++){
    channelsSvg += `<path d="${lanePathD(li)}" fill="none" stroke="${laneAccent[li]}" stroke-width="15" opacity="0.16" stroke-linecap="round"/>`;
  }

  let holesSvg = '';
  let labelsSvg = '';
  for (let li=0; li<3; li++){
    for (let i=0;i<=120;i+=5){
      const big = i%20===0;
      const {x,y} = pointOnLane(li, i);
      holesSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big?2.4:1.6}" fill="${big?'#d9b787':'#8a6a45'}" opacity="${big?0.95:0.6}"/>`;
    }
  }
  // Number labels every 20, on the outer lane only (matches the real board's numbered stripe).
  for (let i=20; i<=120; i+=20){
    const t = i/121;
    if (t>0.44 && t<0.56) continue; // skip labels right at the U-turn, too cramped
    const {x,y} = pointOnLane(2, i);
    const onLeft = t<0.47;
    labelsSvg += `<text x="${(x + (onLeft?-9:9)).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${onLeft?'end':'start'}" font-family="IBM Plex Mono, monospace" font-size="7" fill="#C79A63" opacity="0.7">${i}</text>`;
  }

  // Skunk-line tick marks at 91 / 61 / 31, drawn across the outer lane like a marked line.
  const SKUNK_LINES = [
    { score:91, color:'#e9c67e', label:'91' },
    { score:61, color:'#e18497', label:'61' },
    { score:31, color:'#c94f4f', label:'31' }
  ];
  let skunkSvg = '';
  SKUNK_LINES.forEach(line=>{
    const p = pointOnLane(2, line.score);
    const t = line.score/121;
    const onArc = t>0.44 && t<0.56;
    const dx = onArc ? 0 : 10, dy = onArc ? 10 : 0;
    skunkSvg += `<line x1="${(p.x-dx).toFixed(1)}" y1="${(p.y-dy).toFixed(1)}" x2="${(p.x+dx).toFixed(1)}" y2="${(p.y+dy).toFixed(1)}" stroke="${line.color}" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>`;
  });

  // Each player gets one of the 3 lanes (cycling); pegs sharing a lane+score nudge apart.
  const laneOf = (p) => p.seat % 3;
  const scoreGroups = {};
  players.forEach(p=>{
    const s = Math.min(state.scores[p.id]||0, 121);
    const key = `${laneOf(p)}:${s}`;
    (scoreGroups[key] = scoreGroups[key]||[]).push(p);
  });
  let pegsSvg = '';
  Object.entries(scoreGroups).forEach(([key, group])=>{
    const [li, scoreStr] = key.split(':');
    const base = pointOnLane(Number(li), Number(scoreStr));
    group.forEach((p,gi)=>{
      const offset = gi*7;
      const x = base.x + offset, y = base.y;
      pegsSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${p.color}" stroke="rgba(0,0,0,.55)" stroke-width="1.5"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="rgba(255,255,255,.35)"/>`;
    });
  });

  return `
  <div class="board-stage">
    ${renderSeatFigures(players)}
    <div class="board-circle-wrap">
      <svg viewBox="0 0 300 390" class="board-svg board-svg-tall">
        <defs>
          <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7d5732"/>
            <stop offset="100%" stop-color="#2c1a0c"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="288" height="378" rx="16" fill="url(#woodGrad)"/>
        <rect x="6" y="6" width="288" height="378" rx="16" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="3"/>
        <text x="150" y="30" text-anchor="middle" font-family="Fraunces, serif" font-size="15" fill="#F6EAD0" opacity="0.85">First to 121</text>
        ${channelsSvg}
        ${holesSvg}
        ${labelsSvg}
        ${skunkSvg}
        ${pegsSvg}
      </svg>
    </div>
    <div class="skunk-legend">
      ${SKUNK_LINES.map(l=>`<span><i style="background:${l.color}"></i>${l.label}</span>`).join('')}
    </div>
    ${teams ? `
    <div class="team-summary">
      <span>Team A <b>${teamTotal('A')}</b></span>
      <span>Team B <b>${teamTotal('B')}</b></span>
    </div>` : ''}
    <div class="board-legend">
      ${players.map(p=>`
        <div class="legend-row">
          <span class="dot" style="background:${p.color}"></span>
          <span class="who-name">${p.name}${state.dealer===p.id?'<span class=\"dealer-tag\">DEALER</span>':''}${teams?` <span style="opacity:.5;font-size:11px;">· Team ${p.team}</span>`:''}</span>
          <span class="score">${state.scores[p.id]||0}</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

      ${renderSeatFigures(state.players.slice().sort((a,b)=>a.seat-b.seat))}
      <div class="roster">
        ${state.players.map(p=>`<div class="roster-row"><span class="dot" style="background:${p.color}"></span>${p.name}${p.id===myId?' (you)':''}${state.settings.teams?`<span class="team-tag">TEAM ${p.team}</span>`:''}</div>`).join('')}
      </div>
      <button class="btn full" style="margin-top:14px;" ${state.players.length<2?'disabled':''} onclick="startGame()">Deal the first hand</button>
    </div>`;
  }

  if (full){
    return `${renderTitle(false)}<div class="panel center"><p class="hint">This room is full. Ask the others for a fresh room if you'd like to play too.</p></div>`;
  }

  const avatarCards = AVATARS.map(a=>`
    <div class="avatar-card ${joinForm.avatar===a.id?'active':''} ${usedAv.has(a.id)?'taken':''}"
         style="${usedAv.has(a.id)?'opacity:.35;cursor:not-allowed;':''}"
         onclick="${usedAv.has(a.id)?'':`pickAvatar('${a.id}')`}">
      ${seatFigureSvg({avatar:a.id}, 48)}
      <span class="label">${a.label}</span>
    </div>`).join('');
  const guestCard = `
    <div class="avatar-card guest-card ${joinForm.avatar==='guest'?'active':''}" onclick="pickGuestLook()">
      <span class="label">Someone else</span>
    </div>`;

  const colorOpts = COLORS.map(c=>`
    <div class="swatch ${joinForm.color===c.hex?'active':''} ${used.has(c.hex)?'taken':''}"
         style="background:${c.hex}"
         onclick="${used.has(c.hex)?'':`pickColor('${c.hex}')`}"></div>`).join('');

  const teamButtons = state.settings.teams ? `
    <label class="field-label">Pick a team</label>
    <div class="choice-row">
      <div class="choice ${joinForm.team==='A'?'active':''}" onclick="${teamCount('A')<2?`pickTeam('A')`:''}" style="${teamCount('A')>=2?'opacity:.3;':''}">Team A</div>
      <div class="choice ${joinForm.team==='B'?'active':''}" onclick="${teamCount('B')<2?`pickTeam('B')`:''}" style="${teamCount('B')>=2?'opacity:.3;':''}">Team B</div>
    </div>` : '';

  return `
  ${renderTitle(false)}
  <div class="panel">
    <h3>Join the room</h3>
    ${state.players.length ? renderSeatFigures(state.players.slice().sort((a,b)=>a.seat-b.seat)) : ''}
    <label class="field-label">Who are you?</label>
    <div class="avatar-picker">${avatarCards}${guestCard}</div>
    <label class="field-label">Your name</label>
    <input type="text" placeholder="e.g. Skye" value="${joinForm.name}" oninput="joinForm.name=this.value" maxlength="16">
    ${joinForm.avatar==='guest' ? `
    <label class="field-label">Your peg colour</label>
    <div class="swatches">${colorOpts}</div>` : ''}
    ${teamButtons}
    <button class="btn full" style="margin-top:16px;" ${!joinForm.color?'disabled':''} onclick="joinGame()">Join</button>
  </div>`;
}
function pickColor(hex){ joinForm.color = hex; render(); }
function pickTeam(t){ joinForm.team = t; render(); }

function renderDiscard(){
  const who = actingId();
  const hand = state.hands[who] || [];
  const meDone = state.submittedDiscard[who];
  const need = DISCARD_COUNTS[state.players.length];
  const others = state.players.filter(p=>p.id!==who);
  return `
  ${renderBoard()}
  <div class="panel">
    <h3>Build the crib <span style="font-weight:400;font-size:12px;opacity:.7">${getPlayer(state.dealer).name}'s deal</span></h3>
    <p class="hint">${isSharedDevice() ? `Now discarding for <b style="color:${getPlayer(who).color}">${getPlayer(who).name}</b> — pick ${need} card${need>1?'s':''}.` : (meDone ? 'Waiting on the table…' : `Pick ${need} card${need>1?'s':''} to send to the crib.`)}</p>
    ${!isSharedDevice() ? `
    <div class="other-players">
      ${others.map(p=>`<div class="chip"><span class="dot" style="background:${p.color}"></span>${p.name} ${state.submittedDiscard[p.id]?'✓':'…'}</div>`).join('')}
    </div>` : ''}
  </div>
  <div class="tray-spacer"></div>
  <div class="fixed-hand-tray">
    <div class="fixed-hand-tray-label">Your hand</div>
    <div class="hand">
      ${hand.map((c,i)=>renderCard(c,{
        selected:selectedDiscards.includes(i),
        clickable:!meDone, disabled:meDone,
        onclick: meDone? '' : `toggleDiscard(${i})`
      })).join('')}
    </div>
    <button class="btn full" style="margin-top:12px;" ${selectedDiscards.length!==need||meDone?'disabled':''} onclick="confirmDiscard()">Send to crib (${selectedDiscards.length}/${need})</button>
  </div>`;
}

function renderPegging(){
  const st = state.pegging;
  const who = actingId();
  const myTurn = st.turn===who;
  const myAvail = st.available[who] || [];
  const others = state.players.filter(p=>p.id!==who);
  const iCanPlay = canPlay(who, st.count);
  return `
  ${renderBoard()}
  <div class="turn-banner">${isSharedDevice() ? `Now playing: <b style="color:${getPlayer(st.turn).color}">${getPlayer(st.turn).name}</b>` : (myTurn ? "Your play" : `Waiting on ${getPlayer(st.turn).name}…`)}</div>
  <div class="panel">
    <h3>Pegging</h3>
    ${!isSharedDevice() ? `
    <div class="other-players">
      ${others.map(p=>`<div class="chip"><span class="dot" style="background:${p.color}"></span>${p.name}: ${(st.available[p.id]||[]).length} left</div>`).join('')}
    </div>` : ''}
    <div class="pile" style="margin-top:10px;">
      ${st.pile.length ? st.pile.map(c=>renderCard(c,{mini:true})).join('') : '<span class="hint">No cards played yet</span>'}
    </div>
    <div class="count-badge"><b>${st.count}</b>running count (of 31)</div>
    ${st.log.length ? `<div class="log">${st.log.slice(-6).reverse().map(l=>`<div>${l}</div>`).join('')}</div>` : ''}
  </div>
  <div class="tray-spacer"></div>
  <div class="fixed-hand-tray">
    <div class="fixed-hand-tray-label">Your hand</div>
    <div class="hand">
      ${myAvail.map((c,i)=>{
        const bust = st.count + cardValue(c) > 31;
        return renderCard(c,{
          clickable: myTurn && !bust, disabled: !myTurn || bust,
          onclick: (myTurn && !bust) ? `playCard(${i})` : ''
        });
      }).join('')}
    </div>
    ${myTurn && !iCanPlay ? `<button class="btn full" style="margin-top:12px;" onclick="sayGo()">Say "Go"</button>` : ''}
  </div>`;
}

function renderCounting(){
  if (state.muggins){
    const m = state.muggins;
    const from = getPlayer(m.from);
    const eligible = state.players.filter(p=>p.id!==m.from);
    return `
    ${renderBoard()}
    <div class="panel center">
      <h3>Missed points!</h3>
      <p class="hint">${from.name} only claimed part of their ${m.type==='crib'?'crib':'hand'} — <b style="color:var(--maple)">${m.amount}</b> point${m.amount>1?'s':''} left uncounted. Anyone else can claim them.</p>
      <div class="choice-row" style="flex-wrap:wrap;">
        ${eligible.map(p=>`
          <button class="btn ${canAct(p.id)?'':'ghost'}" style="flex:1 1 40%; margin:4px;" ${canAct(p.id)?'':'disabled'} onclick="claimMuggins('${p.id}')">${p.name} claims it</button>
        `).join('')}
      </div>
      <button class="btn ghost full" style="margin-top:10px;" onclick="skipMuggins()">Let it go</button>
    </div>`;
  }

  const c = state.counting;
  const done = c.index >= c.order.length;
  if (countedIndexSeen !== c.index){ countInputValue=''; peekCorrect=false; countedIndexSeen = c.index; }
  const step = !done ? c.order[c.index] : null;
  const isMyStep = step && step.owner===actingId();
  const cardsForStep = step ? (step.type==='crib' ? state.crib : state.origHands[step.owner]) : null;
  const peek = (step && peekCorrect) ? scoreHand(cardsForStep, state.starter, step.type==='crib') : null;

  return `
  ${renderBoard()}
  <div class="panel">
    <h3>Counting <span style="font-weight:400;font-size:12px;opacity:.7">Starter</span></h3>
    <div class="starter-wrap">${renderCard(state.starter,{})}</div>
    ${c.revealed.map(r=>`
      <div class="count-breakdown" style="margin-bottom:14px;">
        <div class="hand" style="margin-bottom:6px;">${r.cards.map(cd=>renderCard(cd,{mini:true})).join('')}</div>
        <div class="count-total">
          <span>${r.type==='crib'?`${getPlayer(r.owner).name}'s crib`:`${getPlayer(r.owner).name}'s hand`}</span>
          <span>+${r.score}</span>
        </div>
      </div>
    `).join('')}
    ${!done ? `
      <p class="hint">${step.type==='crib'?`${getPlayer(step.owner).name}'s crib`:`${getPlayer(step.owner).name}'s hand`} to count</p>
      <div class="hand" style="margin-bottom:12px;">${cardsForStep.map(cd=>renderCard(cd,{})).join('')}</div>
      ${isMyStep ? `
        <label class="field-label">How many points did you count?</label>
        <input type="number" min="0" max="29" placeholder="0–29" value="${countInputValue}" oninput="countInputValue=this.value">
        <button class="btn full" style="margin-top:10px;" onclick="confirmCount(countInputValue)">Confirm score</button>
        <button class="btn ghost small full" style="margin-top:8px;" onclick="peekCorrect=!peekCorrect; render();">${peekCorrect?'Hide':'Peek at'} the correct count</button>
        ${peek ? `<p class="hint" style="margin-top:8px;">Correct count: <b style="color:var(--maple)">${peek.total}</b>${peek.details.length?` — ${peek.details.join(' · ')}`:' — no points'}</p>` : ''}
      ` : `<p class="hint">Waiting for ${getPlayer(step.owner).name} to count their own hand…</p>`}
    ` : `<p class="hint">Dealing the next hand…</p>`}
  </div>`;
}

function skunkInfo(loserScore){
  if (loserScore<31) return { emoji:'🦨🦨🦨', text:'Triple skunked!' };
  if (loserScore<61) return { emoji:'🦨🦨', text:'Double skunked!' };
  if (loserScore<91) return { emoji:'🦨', text:'Skunked!' };
  return null;
}

function renderGameOver(){
  const teams = state.settings.teams;
  let heading, sub, loserScore;
  if (teams){
    const winners = state.players.filter(p=>p.team===state.winner).map(p=>p.name).join(' & ');
    const loseTeam = state.winner==='A' ? 'B' : 'A';
    loserScore = teamTotal(loseTeam);
    heading = `Team ${state.winner} wins!`;
    sub = winners;
  } else {
    const w = getPlayer(state.winner);
    heading = `${w.name} wins!`;
    sub = state.players.map(p=>`${p.name} ${state.scores[p.id]}`).join(' · ');
    const others = state.players.filter(p=>p.id!==state.winner);
    loserScore = Math.min(...others.map(p=>state.scores[p.id]));
  }
  const skunk = skunkInfo(loserScore);
  return `
  ${renderTitle(false)}
  <div class="winner-screen panel">
    <div class="heart-burst">♠ ♥ ♣ ♦</div>
    <div class="eyebrow">Game</div>
    <h2 style="font-size:28px; margin-top:8px; color:var(--maple)">${heading}</h2>
    ${skunk ? `<div class="skunk-badge">${skunk.emoji} ${skunk.text}</div>` : ''}
    <p class="hint" style="margin-top:10px;">${sub}</p>
    <button class="btn full" style="margin-top:16px;" onclick="playAgain()">Play again</button>
  </div>`;
}

// ---------- Root render ----------
function render(){
  const app = document.getElementById('app');
  if (!state){ app.innerHTML = renderCreate(); return; }
  const soloTag = state.settings.solo && !state.settings.playByLink ? `<div class="solo-badge-wrap"><div class="solo-badge">Solo test mode — you're controlling every seat</div></div>` : '';
  const shareBanner = renderShareLinkBanner();
  let body = '';
  let showFooter = true;
  switch(state.status){
    case 'lobby': body = renderJoinOrWait(); break;
    case 'shuffling': body = `${renderTitle(true)}${soloTag}${shareBanner}${renderShuffling()}`; break;
    case 'cutting': body = `${renderTitle(true)}${soloTag}${shareBanner}${renderCutting()}`; break;
    case 'discard': body = `${renderTitle(true)}${soloTag}${shareBanner}${renderDiscard()}`; showFooter = false; break;
    case 'pegging': body = `${renderTitle(true)}${soloTag}${shareBanner}${renderPegging()}`; showFooter = false; break;
    case 'counting': body = `${renderTitle(true)}${soloTag}${shareBanner}${renderCounting()}`; break;
    case 'gameover': body = renderGameOver(); break;
    default: body = renderCreate();
  }
  app.innerHTML = `${body}${showFooter ? `<footer>Cribbage in Richmond</footer>` : ''}`;
}

// ---------- Installable app setup ----------
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawHeartPath(ctx,cx,cy,size){
  ctx.beginPath();
  const t = size*0.3;
  ctx.moveTo(cx, cy+t);
  ctx.bezierCurveTo(cx, cy, cx-size/2, cy, cx-size/2, cy+t);
  ctx.bezierCurveTo(cx-size/2, cy+(size+t)/2, cx, cy+(size+t)/1.4, cx, cy+size);
  ctx.bezierCurveTo(cx, cy+(size+t)/1.4, cx+size/2, cy+(size+t)/2, cx+size/2, cy+t);
  ctx.bezierCurveTo(cx+size/2, cy, cx, cy, cx, cy+t);
  ctx.closePath();
  ctx.fill();
}
function generateAppIcon(){
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0, '#77502f');
  grad.addColorStop(1, '#2c1a0c');
  ctx.fillStyle = grad;
  roundRectPath(ctx,0,0,size,size,size*0.2);
  ctx.fill();
  ctx.fillStyle = '#F6EAD0';
  drawHeartPath(ctx, size/2, size*0.34, size*0.34);
  ctx.fillStyle = '#2c1a0c';
  ctx.font = `700 ${size*0.13}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.fillText('121', size/2, size*0.82);
  return canvas.toDataURL('image/png');
}
function setupInstallableApp(){
  try{
    const iconUrl = generateAppIcon();
    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);

    const manifest = {
      name: "Cribbage in Richmond",
      short_name: "Cribbage",
      start_url: ".",
      display: "standalone",
      background_color: "#2E1D14",
      theme_color: "#2E1D14",
      icons: [
        { src: iconUrl, sizes: "512x512", type: "image/png" },
        { src: iconUrl, sizes: "192x192", type: "image/png" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(blob);
    document.head.appendChild(manifestLink);
  }catch(e){ /* icon/manifest setup is a nice-to-have, never block the app on it */ }
}

let deferredInstallPrompt = null;
let installBannerDismissed = false;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if (typeof render === 'function' && state===null) render();
});
function isIOSDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandaloneApp(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }catch(e){ return navigator.standalone === true; }
}
async function triggerInstall(){
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  render();
}
function dismissInstallBanner(){ installBannerDismissed = true; render(); }
function renderInstallBanner(){
  if (installBannerDismissed || isStandaloneApp()) return '';
  if (deferredInstallPrompt){
    return `<div class="install-banner">
      <span>Install this as an app on your phone — no App Store needed.</span>
      <button class="btn small" onclick="triggerInstall()">Install</button>
      <button class="btn ghost small" onclick="dismissInstallBanner()">Not now</button>
    </div>`;
  }
  if (isIOSDevice()){
    return `<div class="install-banner">
      <span>On iPhone: tap the Share icon, then "Add to Home Screen" to install this as an app.</span>
      <button class="btn ghost small" onclick="dismissInstallBanner()">Got it</button>
    </div>`;
  }
  return '';
}

// ---------- Boot ----------
async function boot(){
  setupInstallableApp();
  // No storage touched yet — myId is just a local, in-memory placeholder until
  // the person explicitly starts or joins a synced multiplayer room (see
  // ensureMultiplayerSession). Solo and vs-computer modes never need more than this.
  myId = 'local_' + Math.random().toString(36).slice(2,9);
  // Play-by-link games carry their entire state in the URL — if we were opened
  // from a link like that, load straight into the game, no setup needed.
  const hashState = decodeStateFromHash();
  if (hashState){ state = hashState; }
  render();
  setInterval(botMaybeAct, 700);
}
boot();
</script>
